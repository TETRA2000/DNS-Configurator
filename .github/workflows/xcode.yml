name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    env:
      SCHEME: DNS Configurator
      DESTINATION: platform=macOS,variant=Mac Catalyst

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available destinations
      run: xcodebuild -scheme "$SCHEME" -showdestinations

    - name: Build
      run: |
        xcodebuild \
          -scheme "$SCHEME" \
          -destination "$DESTINATION" \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Run Unit Tests
      run: |
        xcodebuild \
          -scheme "$SCHEME" \
          -destination "$DESTINATION" \
          -only-testing:"DNS ConfiguratorTests" \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          test
